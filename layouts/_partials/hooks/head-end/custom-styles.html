<style>
  :root {
    --profile-ink: #202b33;
    --profile-muted: #63717b;
    --profile-line: #dce3e7;
    --profile-accent: #23566b;
    --profile-surface: #f5f8f9;
  }
  html { scroll-behavior: smooth; scroll-padding-top: {{ if .IsHome }}24px{{ else }}80px{{ end }}; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    font-size: 15px !important;
    line-height: 1.65 !important;
    color: var(--profile-ink) !important;
    background: #fff !important;
  }
  .hb-gradient-mesh { display: none !important; }
  .page-body { max-width: 1000px !important; margin: 0 auto !important; padding: 0 32px !important; }
  .hb-section, .hbb-section { padding: 0 !important; margin: 0 !important; }
  .blox-markdown > .flex { width: 100%; padding-inline: 0; }
  h1, h2, h3, h4 { color: var(--profile-ink) !important; line-height: 1.3 !important; }
  h1 { font-size: 32px !important; font-weight: 650 !important; }
  h2 { font-size: 22px !important; font-weight: 650 !important; }
  h3 { font-size: 17px !important; font-weight: 650 !important; }
  p, li, td { font-size: 15px !important; line-height: 1.65 !important; }
  a { color: var(--profile-accent) !important; text-decoration: none !important; }
  a:hover { text-decoration: underline !important; text-underline-offset: 3px; }
  a:focus-visible, video:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--profile-accent); outline-offset: 4px; }
  img, video { max-width: 100%; }
  .navbar { border-bottom: 1px solid var(--profile-line) !important; box-shadow: none !important; background: #fff !important; }
  .navbar > .container, .navbar > .container-fluid, .navbar > div { max-width: 1000px !important; margin: auto !important; padding-left: 32px !important; padding-right: 32px !important; }
  .navbar-brand { font-size: 16px !important; font-weight: 650 !important; }
  .navbar label[for="nav-toggle"] { min-width: 44px; min-height: 44px; justify-content: center; }
  nav a, .nav-link { font-size: 13px !important; color: var(--profile-muted) !important; }
  footer { margin-top: 48px !important; padding: 24px 0 !important; border-top: 1px solid var(--profile-line); font-size: 12px !important; color: var(--profile-muted) !important; }
  footer p, footer a { font-size: 12px !important; color: var(--profile-muted) !important; }
  [class*="max-w-prose"], .prose { max-width: none !important; }
  [class*="max-w-6xl"] { max-width: 1000px !important; }
  [class*="hb-toc"] { display: none !important; }

  /* Research profile: selectors stay scoped away from theme and article layout. */
  .research-profile { width: 100%; margin: 0 auto; }
  .research-profile p, .research-profile h1, .research-profile h2, .research-profile h3, .research-profile h4 { margin: 0; }
  .profile-header { display: grid; grid-template-columns: minmax(0, 1fr) 152px; grid-template-areas: "intro photo" "bio photo"; align-items: start; gap: 20px 48px; padding: 36px 0 0; }
  .profile-intro { grid-area: intro; min-width: 0; }
  .profile-header h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 42px !important; font-weight: 500 !important; letter-spacing: -1.3px; margin: 0 !important; }
  .profile-photo { grid-area: photo; align-self: center; width: 152px; height: 190px; margin: 0 !important; object-fit: cover; border-radius: 4px; }
  .profile-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  .profile-links a { font-size: 14px; font-weight: 550; }
  .link-format { font-size: 10px; color: var(--profile-muted); margin-left: 4px; letter-spacing: .3px; }
  .profile-bio { grid-area: bio; min-width: 0; }
  .profile-bio p { margin-bottom: 12px !important; }
  .profile-bio p:first-child { font-size: 16px !important; line-height: 1.7 !important; }
  .profile-bio p:last-of-type { margin-bottom: 0 !important; }
  .profile-bio p + p { color: var(--profile-muted); }
  .profile-section { margin-top: 38px; padding-top: 26px; border-top: 1px solid var(--profile-line); }
  .section-heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 22px; }
  .section-heading h2 { margin: 0 !important; }
  .section-heading > span, .section-heading > a { font-size: 12px; color: var(--profile-muted) !important; }

  .publication-card { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; padding: 24px; border: 1px solid var(--profile-line); border-radius: 5px; }
  .publication-card + .publication-card { margin-top: 18px; }
  .publication-visual { align-self: center; }
  .publication-copy { min-width: 0; }
  .publication-visual video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 5px; background: var(--profile-surface); border: 1px solid var(--profile-line); }
  .publication-venue { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px !important; font-weight: 650; color: var(--profile-accent); margin-bottom: 9px !important; }
  .spotlight-badge { display: inline-block; border: 1px solid #bfced6; border-radius: 3px; background: #edf4f7; padding: 1px 7px; font-size: 11px; font-weight: 650; letter-spacing: .2px; }
  .publication-copy h3 { font-size: 18px !important; margin: 0 0 8px !important; }
  .publication-copy h3 a { color: var(--profile-ink) !important; }
  .publication-authors { font-size: 12px !important; color: var(--profile-muted); margin-bottom: 10px !important; }
  .publication-copy > p:not(.publication-venue):not(.publication-authors) { font-size: 14px !important; }
  .resource-links { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .resource-links a { font-size: 12px; font-weight: 600; }
  .publication-copy .resource-links { margin: 0 0 10px; }

  .experience-grid { display: grid; gap: 18px; }
  .experience-card { padding: 24px; border: 1px solid var(--profile-line); border-radius: 5px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr); align-items: start; gap: 32px; }
  .experience-card-compact { grid-template-columns: minmax(0, 1fr) 360px; }
  .experience-card-dense { grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; }
  .experience-copy { min-width: 0; }
  .experience-topline { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .experience-number { color: var(--profile-accent); font-size: 12px; font-weight: 650; }
  .experience-period { color: var(--profile-muted); font-size: 11px; }
  .experience-card h3 { margin-bottom: 4px !important; }
  .institution-link { color: var(--profile-ink) !important; }
  .institution-link > span { color: var(--profile-accent); font-size: 11px; font-weight: 400; }
  .experience-role { font-size: 12px !important; color: var(--profile-muted); margin-bottom: 18px !important; }
  .experience-card h4 { font-size: 14px !important; font-weight: 600; margin-bottom: 7px !important; }
  .experience-research-titles { display: grid; gap: 12px; }
  .experience-research-titles h4 { margin-bottom: 0 !important; }
  .experience-summary { font-size: 13px !important; color: var(--profile-muted); }
  .experience-media { display: grid; min-width: 0; gap: 16px 12px; }
  .experience-media-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .experience-media-stack { grid-template-columns: minmax(0, 1fr); }
  .experience-media-compact { width: 100%; max-width: 360px; justify-self: center; }
  .experience-media-dense { width: 100%; max-width: 420px; justify-self: center; gap: 8px; }
  .experience-media figure { min-width: 0; margin: 0; }
  .experience-media video { display: block; width: 100%; margin: 0; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 3px; background: var(--profile-surface); }
  .experience-image-link { display: block; border: 1px solid var(--profile-line); border-radius: 3px; overflow: hidden; background: #fff; }
  .experience-image-link img { display: block; width: 100%; height: auto; margin: 0; }
  .experience-media-dense .experience-image-link { display: grid; aspect-ratio: 4 / 3; padding: 6px; }
  .experience-media-dense .experience-image-link img { min-width: 0; min-height: 0; height: 100%; object-fit: contain; }

  .featured-carousel { width: 100%; min-width: 0; }
  .carousel-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .carousel-count { font-size: 11px; color: var(--profile-muted); }
  .carousel-controls { display: flex; gap: 6px; }
  .carousel-controls button { min-width: 32px; min-height: 32px; border: 1px solid var(--profile-line); border-radius: 4px; background: #fff; color: var(--profile-accent); cursor: pointer; font-size: 16px; }
  .carousel-controls .carousel-toggle { min-width: 56px; padding: 0 8px; font-size: 11px; }
  .carousel-controls button:hover { background: var(--profile-surface); }
  .carousel-controls button:focus-visible, .featured-grid:focus-visible { outline: 2px solid var(--profile-accent); outline-offset: 3px; }
  .featured-grid { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 40px) / 2.7); gap: 20px; overflow-x: auto; padding: 2px 0 10px; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #a8bec9 transparent; }
  .featured-card { display: flex; flex-direction: column; min-width: 0; padding: 12px; border: 1px solid var(--profile-line); border-radius: 6px; scroll-snap-align: start; }
  .featured-media { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; aspect-ratio: 1; margin-bottom: 14px; }
  .featured-media-single { grid-template-rows: minmax(0, 1fr); }
  .featured-media-video-pair { grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
  .featured-image { overflow: hidden; padding: 8px; border: 1px solid var(--profile-line); border-radius: 4px; background: var(--profile-surface); }
  .featured-image img { display: block; width: 100%; height: 100%; min-height: 0; margin: 0; object-fit: contain; border-radius: 2px; background: #fff; }
  .featured-image video { display: block; width: 100%; height: 100%; min-height: 0; margin: 0; object-fit: contain; border-radius: 2px; background: var(--profile-surface); }
  .featured-media-video-pair img { width: 75%; justify-self: center; }
  .card-eyebrow { font-size: 10px !important; color: var(--profile-muted); margin: 0 0 5px !important; text-transform: uppercase; letter-spacing: .5px; }
  .featured-card h3 { margin: 0 0 8px !important; }
  .featured-card > p:not(.card-eyebrow) { font-size: 13px !important; color: var(--profile-muted); margin: 0 0 12px !important; }
  .featured-card .featured-meta { font-size: 11px !important; margin-top: auto !important; margin-bottom: 0 !important; }
  .education-entry { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
  .education-entry h3 { font-size: 16px !important; margin-bottom: 3px !important; }
  .education-entry p { font-size: 14px !important; }
  .education-note, .education-period { font-size: 12px !important; color: var(--profile-muted); }
  .education-period { white-space: nowrap; margin-top: 2px; }

  /* Short project pages can accept a poster and additional media without layout changes. */
  .project-overview { font-size: 17px !important; margin-bottom: 20px; }
  .project-meta { font-size: 13px !important; color: var(--profile-muted); }
  .project-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
  .project-gallery figure { margin: 0; }
  .project-gallery img, .project-gallery video { display: block; width: 100%; border: 1px solid var(--profile-line); border-radius: 4px; }
  .project-gallery figcaption { font-size: 12px; color: var(--profile-muted); margin-top: 6px; }
  .project-poster { margin: 24px 0; }
  .project-poster img { width: 100%; height: auto; border: 1px solid var(--profile-line); }
  @media (max-width: 900px) {
    .experience-card-compact, .experience-card-dense { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 780px) {
    .profile-header { grid-template-columns: minmax(0, 1fr) 136px; column-gap: 32px; }
    .profile-photo { width: 136px; height: 170px; }
    .publication-card { grid-template-columns: 230px 1fr; gap: 20px; padding: 20px; }
    .featured-grid { grid-auto-columns: 310px; gap: 16px; }
    .experience-card { padding: 20px; grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .experience-role { margin-bottom: 12px !important; }
  }
  @media (max-width: 620px) {
    .page-body { padding: 0 20px !important; }
    .navbar > .container, .navbar > .container-fluid, .navbar > div { padding-left: 20px !important; padding-right: 20px !important; }
    .profile-header { grid-template-columns: minmax(0, 1fr) 100px; grid-template-areas: "intro photo" "bio bio"; gap: 20px; padding-top: 28px; }
    .profile-header h1 { font-size: 32px !important; }
    .profile-intro { align-self: center; }
    .profile-photo { width: 100px; height: 125px; }
    .profile-links { gap: 16px; margin-top: 13px; }
    .profile-links a { font-size: 12px; }
    .profile-section { margin-top: 28px; padding-top: 22px; }
    .section-heading h2 { font-size: 20px !important; }
    .publication-card { grid-template-columns: 1fr; }
    .publication-visual video { aspect-ratio: 16 / 9; }
    .project-gallery { grid-template-columns: 1fr; }
    .featured-grid { grid-auto-columns: calc(100% - 28px); }
    .education-entry { flex-direction: column; gap: 3px; }
  }
  @media (max-width: 480px) {
    .publication-card { padding: 16px; }
    .experience-card { padding: 16px; }
    .experience-media-pair { grid-template-columns: minmax(0, 1fr); }
    .profile-photo { width: 84px; height: 105px; }
    .profile-header { grid-template-columns: minmax(0, 1fr) 84px; column-gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
